[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-recorder"
version = "0.1.0"
description = "Full replay recorder that exports agent debugging sessions into deterministic replay files"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-workflow-recorder = "agent_workflow_recorder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_workflow_recorder*"]
